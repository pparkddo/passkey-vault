name: Release

# Publishing happens only for a pushed tag vX.Y.Z. Running this workflow by hand is a dry run: it builds
# the packages and the multi-arch image but publishes nothing. See RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - id: version
        name: Tag, package versions and CHANGELOG agree
        run: |
          tag="${{ env.PUBLISH == 'true' && github.ref_name || '' }}"
          echo "version=$(scripts/version.sh check $tag)" >> "$GITHUB_OUTPUT"

  python:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build --all-packages --out-dir dist
      - name: Wheels install and run
        run: |
          uv run --isolated --no-project --with dist/passkey_vault_client-*.whl pkv --version
          uv run --isolated --no-project --python 3.15 --with dist/passkey_vault_server-*.whl passkey-vault --version
      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: python
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # One environment per project: PyPI accepts a given (repository, workflow, environment) publisher
    # for only one pending project, and separate environments also mean separate approvals.
    strategy:
      matrix:
        include:
          - project: passkey-vault-server
            files: passkey_vault_server-*
            environment: pypi
          - project: passkey-vault-client
            files: passkey_vault_client-*
            environment: pypi-client
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.project }}/
    permissions:
      id-token: write # PyPI Trusted Publishing: no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Select this project's files
        run: mkdir upload && mv dist/${{ matrix.files }} upload/ && ls upload
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: upload/

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.check.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.check.outputs.version }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: LOCK=requirements-db.lock
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ env.PUBLISH == 'true' }}
          provenance: mode=max
          sbom: true
      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    needs: [check, pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          scripts/version.sh notes "$VERSION" > notes.md
          cat >> notes.md <<NOTES

          **Install**
          \`\`\`sh
          uv tool install passkey-vault-client==$VERSION                 # pkv
          docker pull $IMAGE:$VERSION                                    # server
          \`\`\`
          NOTES
          gh release create "v$VERSION" dist/* --verify-tag --title "v$VERSION" --notes-file notes.md
