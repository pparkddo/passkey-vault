[project]
name = "passkey-vault"
version = "0.1.0"
description = "Release one secret to one command, only after you approve it with a passkey."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["passkey", "webauthn", "prf", "secrets", "ai-agents"]
requires-python = ">=3.15"
dependencies = [
    "cryptography>=50.0.2",
    "webauthn>=3.0.1",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.9",
]
mongodb = [
    "pymongo>=4.20.2",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "openapi-spec-validator>=0.9.0",
    "playwright>=1.65.2",
    "pyyaml>=6.0.4",
]
